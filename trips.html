  <!-- Leaflet map JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map("trip-map", {
      scrollWheelZoom: true
    }).setView([48, 10], 4);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const starIcon = L.divIcon({
      className: "star-map-pin",
      html: `<span>✦</span>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9],
      popupAnchor: [0, -10]
    });

    const trips = [
      {
        name: "Athens, Greece",
        coords: [37.9838, 23.7275],
        description: "",
        page: "trip-athens.html"
      },
      {
        name: "Barcelona, Spain",
        coords: [41.3874, 2.1686],
        description: "",
        page: "trip-barcelona.html"
      },
      {

        coords: [50.0755, 14.4378],
        description: "",
        page: "trip-prague.html"
      },
      {

        coords: [55.6761, 12.5683],

      },

        coords: [39.4817, -106.0384],

        description: "",

      },
      {

        description: "",

      },
      {

        description: "",

      },
      {
        name: "Algarve, Portugal",
        coords: [37.0179, -7.9308],
        description: "",

      },
      {

        coords: [66.5039, 25.7294],

        description: "",
        page: "trip-mons-klint.html"
      }
    ];

    trips.forEach((trip) => {
      const popupDescription = trip.description
        ? `<p>${trip.description}</p>`
        : "";

      L.marker(trip.coords, { icon: starIcon })
        .addTo(map)
        .bindPopup(`
          <div class="trip-popup">
            <h3>${trip.name}</h3>
            ${popupDescription}
            <a href="${trip.page}">Open trip</a>
          </div>
        `);
    });
