  function parseLocalDate(dateString) {
    const [year, month, day] = dateString.split("-").map(Number);
    return new Date(year, month - 1, day);
  }

  function formatDate(date) {
    return date.toLocaleDateString("en-US", {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });
  }

  function toDateKey(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
  }

  function addDays(date, days) {
    const copy = new Date(date);
    copy.setDate(copy.getDate() + days);
    return copy;
  }

  function buildTimelineDates() {
    const dates = [];
    let current = parseLocalDate(TIMELINE_START_DATE);
    const end = parseLocalDate(TIMELINE_END_DATE);

    while (current <= end) {
      dates.push(toDateKey(current));
      current = addDays(current, 1);
    }

    return dates;
  }

  function getDefaultTitle(dateKey) {
    if (memoryData[dateKey]?.title) return memoryData[dateKey].title;
    return "Untitled Memory";
  }

  function getDefaultDescription(dateKey) {
    if (memoryData[dateKey]?.description) return memoryData[dateKey].description;
    return "Add description here.";
  }

  function createTimelineCard(dateKey, index) {
    const date = parseLocalDate(dateKey);
    const side = index % 2 === 0 ? "left" : "right";
    const tags = firsts[dateKey] || [];
    const themeClass = themedCards[dateKey] || "";
    const title = getDefaultTitle(dateKey);
    const description = getDefaultDescription(dateKey);
    const isLong = description.length > 220;

    const item = document.createElement("article");
    item.className = `timeline-item ${side} ${themeClass}`;
    item.id = `date-${dateKey}`;

    item.dataset.date = dateKey;
    item.dataset.search = `
      ${dateKey}
      ${formatDate(date)}
      ${title}
      ${description}
      ${tags.join(" ")}
    `.toLowerCase();

    item.innerHTML = `
      <div class="timeline-dot"></div>

      <div class="timeline-card">
        <div class="timeline-card-top">
          <p class="timeline-date">${formatDate(date)}</p>
          ${tags.length ? `<span class="first-badge">✦ First</span>` : ""}
        </div>

        <h2>${title}</h2>

        <div class="timeline-description ${isLong ? "collapsed" : ""}">
          <p>${description}</p>
        </div>

        ${isLong ? `<button class="read-more-button">Read more</button>` : ""}
      </div>
    `;

    return item;
  }

  function renderTimeline() {
    const container = document.getElementById("timelineContainer");
    const dates = buildTimelineDates();

    container.innerHTML = "";

    dates.forEach((dateKey, index) => {
      const card = createTimelineCard(dateKey, index);
      container.appendChild(card);
    });

    updateCount();
    setupReadMoreButtons();
  }

  function setupReadMoreButtons() {
  document.querySelectorAll(".read-more-button").forEach((button) => {
    button.addEventListener("click", () => {
      const card = button.closest(".timeline-card");
      const description = card.querySelector(".timeline-description");

      description.classList.toggle("collapsed");
      card.classList.toggle("expanded");

      button.textContent = description.classList.contains("collapsed")
        ? "Read more"
        : "Show less";
    });
  });
}

  function updateCount() {
    const visibleCards = document.querySelectorAll(".timeline-item:not(.hidden)").length;
    const totalCards = document.querySelectorAll(".timeline-item").length;

    document.getElementById("timelineCount").textContent =
      `${visibleCards} of ${totalCards} timeline cards showing`;
  }

  function searchTimeline(query) {
    const cleanedQuery = query.trim().toLowerCase();
    const cards = document.querySelectorAll(".timeline-item");

    cards.forEach((card) => {
      if (!cleanedQuery) {
        card.classList.remove("hidden");
        return;
      }

      const matches = card.dataset.search.includes(cleanedQuery);
      card.classList.toggle("hidden", !matches);
    });

    updateCount();
  }

  function jumpToRandomVisibleCard() {
    const visibleCards = Array.from(
      document.querySelectorAll(".timeline-item:not(.hidden)")
    );

    if (!visibleCards.length) return;

    const randomCard = visibleCards[Math.floor(Math.random() * visibleCards.length)];

    randomCard.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

    randomCard.classList.add("random-highlight");

    setTimeout(() => {
      randomCard.classList.remove("random-highlight");
    }, 1400);
  }

  document.getElementById("timelineSearch").addEventListener("input", (event) => {
    searchTimeline(event.target.value);
  });

  document.getElementById("randomMemory").addEventListener("click", () => {
    jumpToRandomVisibleCard();
  });

  document.getElementById("clearSearch").addEventListener("click", () => {
    document.getElementById("timelineSearch").value = "";
    searchTimeline("");
  });
